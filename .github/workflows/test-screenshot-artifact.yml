name: Test screenshot artifact

on:
  workflow_dispatch:
  push:
    branches:
      - test/screenshot-artifact-handoff
    paths:
      - .github/workflows/test-screenshot-artifact.yml
      - test-artifacts/home.jpg

jobs:
  upload-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: test-artifacts/home.jpg
          if-no-files-found: error
